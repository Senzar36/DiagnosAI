<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinCare</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>KinCare</h1>
    </header>
    <main>
        <section id="home">
            <h2>Welcome to KinCare</h2>
            <p>Your trusted partner in healthcare.</p>
        </section>
        <h4>Enter the login details below</h4>
        <form id="LoginForm" action="/login" method="post">
            <input type="text" id="username" name="username" placeholder="Username" required><br><br>
            <input type="password" id="password" name="password" placeholder="Password" required><br><br>
            <button type="submit" onclick="regsiter_validate()">Register</button>
            <button type="submit" onclick="login_validate()">Login</button>
        </form>
        
    </main>
    <footer>
        <p>&copy; 2026 KinCare. All rights reserved.</p>
        <p>Built by Anirudh Dhamodaran.</p>
    </footer>
</body>
</html>
