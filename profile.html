<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Kincare Profile</title>
</head>
<body>
    <header>
        <h1>Welcome to KinCare</h1>
        <nav>
            <ul>
                <li><a href="index.html"><button>Home</button></a></li>
                <li><a href="main.html"><button>Main</button></a></li>
                <li><a href="profile.html"><button>Profile</button></a></li>
                <li><a href="about.html"><button>About</button></a></li>
            </ul>
        </nav>
    </header>
    <h3>Create your KinCare profile here.</h3>
    <p>Here you can create and manage your health profile.</p>
    <main>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required><br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Age" required><br><br>
            <label for="gender">Gender:</label>
            <input type="text" id="gender" name="gender" placeholder="Gender" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required><br><br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone" required><br><br>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" placeholder="Address" required><br><br>
            <label for="medical_history">Medical History:</label>
            <textarea id="medical_history" name="medical_history" placeholder="Medical History" required></textarea><br><br>
            <label for="allergies">Allergies:</label>
            <textarea id="allergies" name="allergies" placeholder="Allergies" required></textarea><br><br>
            <input type="submit" value="Create Profile">
        </form>
    </main>
</body>
</html>
